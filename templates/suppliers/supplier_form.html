{% extends 'base.html' %}

{% block title %}{% if is_edit %}Edit{% else %}Add{% endif %} Supplier{% endblock %}

{% block content %}
<h2>{% if is_edit %}Edit{% else %}Add New{% endif %} Supplier</h2>

<div class="row justify-content-center">
    <div class="col-lg-10">
        <form method="post" class="needs-validation" novalidate>
            {% csrf_token %}
            
            <!-- Company Information -->
            <div class="card mb-3">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">Company Information</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Company Name *</label>
                            <input type="text" name="company_name" class="form-control" 
                                   value="{% if supplier %}{{ supplier.company_name }}{% endif %}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contact Person *</label>
                            <input type="text" name="contact_person" class="form-control" 
                                   value="{% if supplier %}{{ supplier.contact_person }}{% endif %}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input type="email" name="email" class="form-control" 
                                   value="{% if supplier %}{{ supplier.email }}{% endif %}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone *</label>
                            <input type="tel" name="phone" class="form-control" 
                                   value="{% if supplier %}{{ supplier.phone }}{% endif %}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Alternate Phone</label>
                            <input type="tel" name="alternate_phone" class="form-control" 
                                   value="{% if supplier %}{{ supplier.alternate_phone }}{% endif %}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Website</label>
                            <input type="url" name="website" class="form-control" 
                                   value="{% if supplier %}{{ supplier.website }}{% endif %}" 
                                   placeholder="https://example.com">
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Address -->
            <div class="card mb-3">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">Address</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label">Address Line 1 *</label>
                            <input type="text" name="address_line1" class="form-control" 
                                   value="{% if supplier %}{{ supplier.address_line1 }}{% endif %}" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Address Line 2</label>
                            <input type="text" name="address_line2" class="form-control" 
                                   value="{% if supplier %}{{ supplier.address_line2 }}{% endif %}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">City *</label>
                            <input type="text" name="city" class="form-control" 
                                   value="{% if supplier %}{{ supplier.city }}{% endif %}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">State/County</label>
                            <input type="text" name="state" class="form-control" 
                                   value="{% if supplier %}{{ supplier.state }}{% endif %}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Postal Code</label>
                            <input type="text" name="postal_code" class="form-control" 
                                   value="{% if supplier %}{{ supplier.postal_code }}{% endif %}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Country</label>
                            <input type="text" name="country" class="form-control" 
                                   value="{% if supplier %}{{ supplier.country }}{% else %}Kenya{% endif %}">
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Business Details -->
            <div class="card mb-3">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">Business Details</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Tax ID / VAT Number</label>
                            <input type="text" name="tax_id" class="form-control" 
                                   value="{% if supplier %}{{ supplier.tax_id }}{% endif %}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">License Number</label>
                            <input type="text" name="license_number" class="form-control" 
                                   value="{% if supplier %}{{ supplier.license_number }}{% endif %}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Payment Terms</label>
                            <input type="text" name="payment_terms" class="form-control" 
                                   value="{% if supplier %}{{ supplier.payment_terms }}{% endif %}" 
                                   placeholder="e.g., Net 30, Net 60">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Rating</label>
                            <select name="rating" class="form-select">
                                {% for i in "12345" %}
                                <option value="{{ forloop.counter }}" 
                                        {% if supplier and supplier.rating == forloop.counter %}selected{% endif %}>
                                    {{ forloop.counter }} Star{% if forloop.counter > 1 %}s{% endif %}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="3">{% if supplier %}{{ supplier.notes }}{% endif %}</textarea>
                        </div>
                        <div class="col-md-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_active" 
                                       {% if not supplier or supplier.is_active %}checked{% endif %}>
                                <label class="form-check-label">Active Status</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="d-flex justify-content-between">
                <a href="{% url 'suppliers:supplier_list' %}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    {% if is_edit %}Update{% else %}Create{% endif %} Supplier
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
